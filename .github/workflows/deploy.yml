name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a second push waits for the first to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull, build and restart on migration.mvn.co.il
    runs-on: ubuntu-latest
    timeout-minutes: 240  # image build ~10 min plus up to 3 h waiting for in-flight migrations
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '2.28.68.194' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/migration-tool' }}

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
            set -euo pipefail
            cd "${DEPLOY_DIR:-/opt/migration-tool}"
            echo "== git pull =="
            git fetch origin main
            git reset --hard origin/main
            git log -1 --oneline
            cd docker
            DEPLOY_SHA=$(git rev-parse HEAD)
            echo "== docker compose build =="
            docker compose --env-file ../.env build --quiet --build-arg GIT_SHA="$DEPLOY_SHA"
            # `docker compose images -q` has been seen returning a stale id right after a build
            # in this environment, silently masking a real code change; ask Docker directly for
            # the tag's current id instead, which always reflects the build that just ran.
            APP_IMAGE_TAG=$(docker compose --env-file ../.env config --images | grep -v '^postgres' | head -1)
            BUILT_IMAGE=$(docker inspect -f '{{.Id}}' "$APP_IMAGE_TAG")
            echo "app image tag: $APP_IMAGE_TAG"
            echo "built image: $BUILT_IMAGE"
            echo "== waiting for in-flight migrations (restart would kill them) =="
            for i in $(seq 1 360); do
              n=$(docker compose --env-file ../.env exec -T postgres psql -U migration -d migration -At -c "select count(*) from migrations where status in ('running','pending','awaiting_review')" 2>/dev/null | tr -d '[:space:]')
              if [ -z "$n" ] || [ "$n" = "0" ]; then break; fi
              echo "  $n migration(s) in progress; waiting 30s ($i/360)"
              sleep 30
            done
            echo "== docker compose up (--force-recreate: a rebuilt image alone does not always make compose recreate a running container) =="
            docker compose --env-file ../.env up -d --force-recreate app
            docker compose --env-file ../.env up -d
            docker compose --env-file ../.env ps
            echo "== verifying the app itself reports this commit: self-healing, since a recreate has been observed not to stick on the first try in this environment =="
            SERVED_SHA=""
            for attempt in 1 2 3; do
              for i in $(seq 1 12); do
                SERVED_SHA=$(curl -fsS http://127.0.0.1:8080/api/v1/health 2>/dev/null | grep -o '"git_sha":"[^"]*"' | cut -d'"' -f4 || true)
                [ "$SERVED_SHA" = "$DEPLOY_SHA" ] && break 2
                sleep 5
              done
              echo "attempt $attempt: served git_sha=$SERVED_SHA, expected $DEPLOY_SHA -- forcing another recreate"
              docker compose --env-file ../.env up -d --force-recreate app
            done
            RUNNING_IMAGE=$(docker inspect -f '{{.Image}}' docker-app-1)
            echo "built image:   $BUILT_IMAGE"
            echo "running image: $RUNNING_IMAGE"
            echo "deployed commit: $DEPLOY_SHA"
            echo "served git_sha:  $SERVED_SHA"
            if [ "$SERVED_SHA" != "$DEPLOY_SHA" ]; then
              echo "FATAL: the running app reports git_sha=$SERVED_SHA, not $DEPLOY_SHA -- this deploy did not really take effect"
              exit 1
            fi
            echo "confirmed: the running app itself reports the deployed commit"
          REMOTE

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://$DEPLOY_HOST:8080/api/v1/health"; then
              echo; echo "healthy"; exit 0
            fi
            echo "waiting for app... ($i/12)"; sleep 5
          done
          echo "app did not become healthy"; exit 1
