name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a second push waits for the first to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull, build and restart on migration.mvn.co.il
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '2.28.68.194' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/migration-tool' }}

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
            set -euo pipefail
            cd "${DEPLOY_DIR:-/opt/migration-tool}"
            echo "== git pull =="
            git fetch origin main
            git reset --hard origin/main
            git log -1 --oneline
            cd docker
            echo "== docker compose build =="
            docker compose --env-file ../.env build --quiet
            echo "== docker compose up =="
            docker compose --env-file ../.env up -d
            docker compose --env-file ../.env ps
          REMOTE

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://$DEPLOY_HOST:8080/api/v1/health"; then
              echo; echo "healthy"; exit 0
            fi
            echo "waiting for app... ($i/12)"; sleep 5
          done
          echo "app did not become healthy"; exit 1
